<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="refresh" content="0; url=https://kalatg.ch/" />
    <link rel="canonical" href="https://kalatg.ch/" />
    <title>Weiterleitung zu kalatg.ch</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8f5f5;
        color: #242020;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 540px);
        padding: clamp(32px, 7vw, 56px);
        text-align: center;
        background: #ffffff;
        border: 1px solid #e4dcdc;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgb(77 0 10 / 9%);
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #7b000c;
        color: #ffffff;
        font-size: 28px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.7rem, 5vw, 2.3rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #655d5d;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 28px;
        padding: 12px 22px;
        border-radius: 999px;
        background: #7b000c;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #5f0009;
      }

      a:focus-visible {
        outline: 3px solid #d98e96;
        outline-offset: 3px;
      }
    </style>
    <script>
      window.location.replace("https://kalatg.ch/");
    </script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">B</div>
      <h1>Weiter zu kalatg.ch</h1>
      <p>Du wirst automatisch zur Website des Kantonallagers weitergeleitet.</p>
      <a href="https://kalatg.ch/">Jetzt zu kalatg.ch wechseln</a>
    </main>
  </body>
</html>
